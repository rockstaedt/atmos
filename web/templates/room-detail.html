{{define "title"}}{{.Data.RoomName}} - Atmos Climate Monitor{{end}}

{{define "head"}}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
{{end}}

{{define "content"}}
<main class="page">
    {{template "room-detail-fragment" .Data}}

    <section class="fade-in" style="margin-bottom:20px; display:flex; gap:12px; flex-wrap:wrap;">
        <button onclick="loadChart('12h')" id="btn-12h" class="button ghost">Last 12 hours</button>
        <button onclick="loadChart('24h')" id="btn-24h" class="button">Last 24 hours</button>
        <button onclick="loadChart('7d')" id="btn-7d" class="button ghost">Last 7 days</button>
    </section>

    <section class="grid" style="grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));">
        <div class="card">
            <h3 class="card-title">Temperature & Humidity</h3>
            <canvas id="tempHumidityChart" height="200"></canvas>
        </div>

        <div class="card">
            <h3 class="card-title">Pressure</h3>
            <canvas id="pressureChart" height="200"></canvas>
        </div>
    </section>
</main>
{{end}}

{{define "footer"}}
<span class="meta">{{.Version}}</span>
{{end}}

{{define "scripts"}}
<script>
let tempHumidityChart, pressureChart;

async function loadChart(range) {
    // Update button states
    document.querySelectorAll('[id^="btn-"]').forEach(btn => {
        btn.classList.add('ghost');
    });
    document.getElementById('btn-' + range).classList.remove('ghost');

    try {
        const response = await fetch('/api/rooms/{{.Data.RoomID}}/measurements?range=' + range);
        const data = await response.json();

        if (!data.labels || data.labels.length === 0) {
            console.warn('No data available for range:', range);
            return;
        }

        // Convert to {x: timestamp, y: value} format for time scale
        const timestamps = data.labels.map(ts => new Date(ts));
        const tempData = timestamps.map((t, i) => ({x: t, y: data.temperature[i]}));
        const humidityData = timestamps.map((t, i) => ({x: t, y: data.humidity[i]}));
        const pressureData = timestamps.map((t, i) => ({x: t, y: data.pressure[i]}));

        // Time display format based on range
        const timeUnit = (range === '12h' || range === '24h') ? 'hour' : 'day';
        const displayFormats = {
            hour: 'HH:mm',
            day: 'dd.MM HH:mm'
        };

        // Temperature & Humidity Chart
        if (tempHumidityChart) tempHumidityChart.destroy();
        const ctx1 = document.getElementById('tempHumidityChart').getContext('2d');
        tempHumidityChart = new Chart(ctx1, {
            type: 'line',
            data: {
                datasets: [
                    {
                        label: 'Temperature (°C)',
                        data: tempData,
                        borderColor: '#1d4ed8',
                        backgroundColor: 'rgba(29, 78, 216, 0.12)',
                        tension: 0.4,
                        fill: true,
                        spanGaps: 300000 // Only connect points if gap < 5 minutes
                    },
                    {
                        label: 'Humidity (%)',
                        data: humidityData,
                        borderColor: '#0f766e',
                        backgroundColor: 'rgba(15, 118, 110, 0.12)',
                        tension: 0.4,
                        fill: true,
                        spanGaps: 300000
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'bottom'
                    }
                },
                scales: {
                    y: {
                        grid: {
                            color: 'rgba(28, 27, 24, 0.08)'
                        }
                    },
                    x: {
                        type: 'time',
                        time: {
                            unit: timeUnit,
                            displayFormats: displayFormats,
                            tooltipFormat: 'dd.MM.yyyy HH:mm'
                        },
                        grid: {
                            display: false
                        }
                    }
                }
            }
        });

        // Pressure Chart
        if (pressureChart) pressureChart.destroy();
        const ctx2 = document.getElementById('pressureChart').getContext('2d');
        pressureChart = new Chart(ctx2, {
            type: 'line',
            data: {
                datasets: [{
                    label: 'Pressure (hPa)',
                    data: pressureData,
                    borderColor: '#e07a2f',
                    backgroundColor: 'rgba(224, 122, 47, 0.15)',
                    tension: 0.4,
                    fill: true,
                    spanGaps: 300000
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'bottom'
                    }
                },
                scales: {
                    y: {
                        grid: {
                            color: 'rgba(28, 27, 24, 0.08)'
                        }
                    },
                    x: {
                        type: 'time',
                        time: {
                            unit: timeUnit,
                            displayFormats: displayFormats,
                            tooltipFormat: 'dd.MM.yyyy HH:mm'
                        },
                        grid: {
                            display: false
                        }
                    }
                }
            }
        });
    } catch (error) {
        console.error('Error loading chart data:', error);
    }
}

// Load 24h data by default
loadChart('24h');
</script>
{{end}}
