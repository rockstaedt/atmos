{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{block "title" .}}Atmos Climate Monitor{{end}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-blue-600 text-white p-4 shadow-lg">
        <div class="container mx-auto">
            <h1 class="text-2xl font-bold">Atmos Climate Monitor</h1>
        </div>
    </nav>

    <main class="container mx-auto p-4 mt-6">
        {{block "content" .}}{{end}}
    </main>

    <footer class="text-center text-gray-500 text-sm mt-12 mb-4">
        <p>Last updated: <span class="font-mono">{{.LastUpdated.Format "2006-01-02 15:04:05 UTC"}}</span></p>
    </footer>
</body>
</html>
{{end}}
