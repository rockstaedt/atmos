version: '3.8'

services:
  atmos:
    build: .
    image: atmos:latest
    container_name: atmos
    ports:
      - "8080:8080"
    volumes:
      - atmos-data:/data
    environment:
      - PORT=8080
      - DB_PATH=/data/atmos.db
      - API_KEY=${API_KEY}
      - DASHBOARD_KEY=${DASHBOARD_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  atmos-data:
    driver: local
